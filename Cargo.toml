[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/node-litesvm/tests/clock-example"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LiteSVM/litesvm"
rust-version = "1.86.0"

[workspace.dependencies]
agave-feature-set = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
agave-precompiles = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
agave-reserved-account-keys = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
agave-syscalls = { package = "solana-syscalls", git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", default-features = false, features = ["agave-unstable-api"] }
ansi_term = "0.12"
bincode = "1.3.3"
bv = "0.11.1"
criterion = "0.8"
ed25519-dalek = "=1.0.1"
hashbrown = "0.16.0"
hex = "0.4.3"
indexmap = "2.12"
itertools = "0.14"
libsecp256k1 = "0.6.0"
litesvm = { path = "crates/litesvm", version = "0.11" }
log = "0.4"
napi = { version = "3.8.3", default-features = false }
napi-build = "2.3.1"
napi-derive = "3.5.2"
qualifier_attr = "0.2.2"
serde = "1.0.203"
sha2 = "0.10.9"
smallvec = "1.13"
solana-account = "4.1.0"
solana-address = "2.0"
solana-address-lookup-table-interface = "3.0"
solana-bpf-loader-program = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-builtins = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-clock = "3.0"
solana-compute-budget = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-compute-budget-instruction = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-compute-budget-interface = "3.0"
solana-config-interface = "2.0.0"
solana-ed25519-program = "3.0"
solana-epoch-rewards = "3.0"
solana-epoch-schedule = "3.0"
solana-fee = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-feature-gate-interface = "4.0.0"
solana-fee-structure = "3.0"
solana-hash = "3.1.0"
solana-instruction = "3.0"
solana-instructions-sysvar = "3.0"
solana-keypair = "3.1"
solana-last-restart-slot = "3.0"
solana-loader-v3-interface = "6.1.0"
solana-loader-v4-program = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", default-features = false, features = ["agave-unstable-api", "metrics"] }
solana-loader-v4-interface = "3.1.0"
solana-message = "4.0.0"
solana-native-token = "3.0"
solana-nonce = "3.0"
solana-nonce-account = "4.0.0"
solana-precompile-error = "3.0"
solana-program-error = "3.0"
solana-program-option = "3.0"
solana-program-pack = "3.0"
solana-program-runtime = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-rent = "4.1.0"
solana-sdk-ids = "3.0"
solana-secp256k1-program = "3.0"
solana-sha256-hasher = "3.1.0"
solana-signature = "3.1.0"
solana-signer = "3.0"
solana-slot-hashes = "3.0"
solana-slot-history = "3.0"
solana-stake-interface = "3.0.0"
solana-svm-callback = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-svm-log-collector = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-svm-timings = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-svm-transaction = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-system-interface = "3.1"
solana-system-program = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api"] }
solana-sysvar = "4.0.0"
solana-sysvar-id = "3.0"
solana-transaction = { version = "4.0.0", features = ["wincode"] }
solana-transaction-context = { git = "https://github.com/anza-xyz/agave", rev = "abfc33086c3eda73f89c0105e329a31c6b147ed0", features = ["agave-unstable-api", "bincode"] }
solana-transaction-error = "3.0.0"
solana-vote-interface = "5.0.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "2.0.0"
spl-token-interface = "2.0.0"
test-log = "0.2"
thiserror = "2.0"

[profile.bench]
debug = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.clippy]
result_large_err = "allow"
